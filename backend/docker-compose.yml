services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paisa
      POSTGRES_PASSWORD: paisa
      POSTGRES_DB: paisa_path
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paisa -d paisa_path"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
