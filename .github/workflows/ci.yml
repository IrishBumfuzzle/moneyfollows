name: ci

on:
  pull_request:
  push:
    branches: [main, Backend]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # SQL tests create and drop their own databases here (supabase/tests).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['54330:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      # With CI set, the SQL tests never skip: a missing database fails the build.
      # (Locally, without CI, they skip when nothing listens on 54330.)
      CI: 'true'
      SUPABASE_TEST_DB_URL: postgres://postgres:postgres@localhost:54330/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The Vercel build, so a broken app build fails here and not on deploy.
      - run: pnpm --filter student build
