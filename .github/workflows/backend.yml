name: backend

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Route and DB tests create and drop their own databases on this server.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: paisa
          POSTGRES_PASSWORD: paisa
          POSTGRES_DB: paisa_path
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U paisa -d paisa_path"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://paisa:paisa@localhost:5432/paisa_path
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
